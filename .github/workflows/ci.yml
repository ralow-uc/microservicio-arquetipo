# Integracion continua del arquetipo: lo instala, genera un microservicio de
# prueba con el y ejecuta las pruebas del proyecto generado. Si la plantilla
# produce un proyecto que no compila o no pasa sus pruebas, el cambio no entra.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  arquetipo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Instalar el arquetipo
        run: chmod +x mvnw && ./mvnw -B clean install
      - name: Generar un microservicio de prueba
        working-directory: /tmp
        run: |
          "$GITHUB_WORKSPACE/mvnw" -B archetype:generate -DarchetypeCatalog=local \
            -DarchetypeGroupId=com.foro -DarchetypeArtifactId=microservicio-arquetipo \
            -DarchetypeVersion=1.0.0 -DgroupId=com.foro -DartifactId=servicio-prueba \
            -Dpackage=com.foro.prueba -Dversion=1.0.0 -DnombreClase=ServicioPrueba \
            -Dentidad=Etiqueta -Drecurso=etiquetas -Dtabla=ETIQUETA -Dpuerto=8090 \
            -DinteractiveMode=false
      - name: Pruebas del proyecto generado
        working-directory: /tmp/servicio-prueba
        run: chmod +x mvnw && ./mvnw -B test

# Perfil "test": H2 en memoria en modo Oracle, para validar el mismo mapeo JPA.
spring.datasource.url=jdbc:h2:mem:${artifactId}_test;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

foro.jwt.secreto=secreto-exclusivo-de-las-pruebas-automatizadas-del-foro

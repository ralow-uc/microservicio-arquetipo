#set( $d = "$" )
# ---------------------------------------------------------------------------
# Microservicio ${artifactId}  (generado con microservicio-arquetipo)
#
# Perfiles disponibles:
#   local   -> H2 en memoria, para desarrollar sin credenciales.
#   oracle  -> esquema FORO en Oracle Autonomous Database.
# ---------------------------------------------------------------------------

spring.application.name=${artifactId}
spring.profiles.active=${d}{SPRING_PROFILES_ACTIVE:local}

server.port=${d}{PORT:${puerto}}

# Las respuestas de error incluyen el mensaje para facilitar la revision en Postman.
server.error.include-message=always
spring.jackson.serialization.indent-output=true

# Secreto compartido con foro-usuarios para validar el JWT.
foro.jwt.secreto=${d}{FORO_JWT_SECRETO:clave-de-desarrollo-del-foro-de-cubos-no-usar-en-produccion}

# Origenes permitidos por CORS, separados por coma.
foro.cors.origenes=${d}{FORO_CORS_ORIGENES:http://localhost:*}

logging.level.root=INFO
logging.level.${package}=DEBUG

management.endpoints.web.exposure.include=health,info

#set( $d = "$" )
# ---------------------------------------------------------------------------
# Perfil "oracle": esquema FORO en Oracle Autonomous Database.
#
# Las credenciales NO se escriben aqui: llegan por variables de entorno
# (scripts/entorno-oracle.sh en desarrollo, archivo .env en Docker).
# La ruta del Wallet no puede contener espacios (ORA-12263).
# ---------------------------------------------------------------------------
spring.datasource.url=${d}{ORACLE_JDBC_URL}
spring.datasource.username=${d}{ORACLE_USER}
spring.datasource.password=${d}{ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# Las tablas se crean con scripts/01_crear_tablas.sql; JPA solo las valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=FORO
